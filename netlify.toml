[build]
  publish = "dist"
  command = "npm run build"

# SEO Dynamic Files - Proxy to Supabase Edge Functions
[[redirects]]
  from = "/llms.txt"
  to = "https://fgdskfvmcjdruiguzebd.supabase.co/functions/v1/serve-llms-txt"
  status = 200
  force = true
  headers = {Content-Type = "text/plain; charset=utf-8", Cache-Control = "public, max-age=3600"}

[[redirects]]
  from = "/sitemap.xml"
  to = "https://fgdskfvmcjdruiguzebd.supabase.co/functions/v1/serve-sitemap-xml"
  status = 200
  force = true
  headers = {Content-Type = "application/xml; charset=utf-8", Cache-Control = "public, max-age=3600"}

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://www.googletagmanager.com https://api.resend.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# SPA Fallback - Must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
