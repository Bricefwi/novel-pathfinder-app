[build]
  publish = "dist"
  command = "npm run build"

# SEO Dynamic Files - Proxy to Supabase Edge Functions
[[redirects]]
  from = "/llms.txt"
  to = "https://fgdskfvmcjdruiguzebd.supabase.co/functions/v1/serve-llms-txt"
  status = 200
  force = true
  headers = {Content-Type = "text/plain; charset=utf-8", Cache-Control = "public, max-age=3600"}

[[redirects]]
  from = "/sitemap.xml"
  to = "https://fgdskfvmcjdruiguzebd.supabase.co/functions/v1/serve-sitemap-xml"
  status = 200
  force = true
  headers = {Content-Type = "application/xml; charset=utf-8", Cache-Control = "public, max-age=3600"}

# SPA Fallback - Must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
